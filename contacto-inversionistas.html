<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto de Inversionistas · Multi X</title>
  <meta name="description" content="Contacto de Relación con Inversionistas de Multi X.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/layout.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>
  <site-header current="inversionistas"></site-header>

  <main id="main">
    <!-- Páginas internas de Inversionistas: primero el sub-menú, luego el encabezado -->
    <ir-subnav current="contacto"></ir-subnav>

    <!-- Encabezado en crema con foto (mismo patrón que Centro de Resultados) -->
    <div class="section--subtle page-intro">
      <div class="container page-intro__inner">
        <div class="page-intro__text">
    <header class="page-head">
      <h1 class="t-h1">Contacto</h1>
      <p class="t-body-l page-head__lead">Contacta al equipo de Relación con Inversionistas de Multi X y suscríbete a las alertas al inversionista. [contenido por definir]</p>
    </header>
        </div>
        <figure class="page-intro__media">
          <img src="assets/img/inversionistas-hero.webp" alt="" width="504" height="372">
        </figure>
      </div>
    </div>

    <!-- Contacto: el mismo módulo de Inversionistas -->
    <section class="section" aria-labelledby="ir-contact-title">
      <div class="container split">
        <div class="section-head reveal">
          <h2 class="t-h2" id="ir-contact-title">Contacto de Inversionistas</h2>
          <p class="t-body-l section-head__lead">Para consultas de accionistas, analistas e inversionistas. [contenido por definir]</p>
        </div>
        <ir-contact class="reveal" name="Nombre Apellido" role-title="Head of Investor Relations" phone="+56 65 248 3700" email="inversionistas@multi-x.cl"></ir-contact>
      </div>
      <div class="container">
        <ir-alerts class="reveal" email="inversionistas@multi-x.cl"></ir-alerts>
      </div>
    </section>

  </main>

  <site-footer></site-footer>
</body>
</html>
