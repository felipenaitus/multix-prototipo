<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oferta laboral · Multi X</title>
  <meta name="description" content="Detalle de la oferta laboral en Multi X: descripción, requisitos y postulación.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@200;300;400;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/layout.js" defer></script>
  <script src="js/ofertas.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>
  <site-header current="trabaja"></site-header>

  <main id="main" data-job-detail>
    <div class="container">
      <header class="job-head">
        <nav class="breadcrumb" aria-label="Migas de pan">
          <ol class="breadcrumb__list">
            <li class="breadcrumb__item"><a href="index.html">Inicio</a><svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"></use></svg></li>
            <li class="breadcrumb__item"><a href="trabaja-con-nosotros.html">Trabaja con Nosotros</a><svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"></use></svg></li>
            <li class="breadcrumb__item"><a href="oportunidades-laborales.html">Oportunidades laborales</a><svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"></use></svg></li>
            <li class="breadcrumb__item"><span aria-current="page" data-job-field="title"></span></li>
          </ol>
          <a class="breadcrumb__back" href="oportunidades-laborales.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>Volver al listado de ofertas</a>
        </nav>
        <h1 class="t-h1" data-job-field="title"></h1>
          <dl class="job-head__facts t-small">
            <div><dt>Área</dt><dd data-job-field="area"></dd></div>
            <div><dt>Área de trabajo</dt><dd data-job-field="group"></dd></div>
            <div><dt>Ubicación</dt><dd data-job-field="place"></dd></div>
            <div><dt>Código</dt><dd data-job-field="id"></dd></div>
          </dl>
      </header>

      <div class="job-detail">
        <div class="job-detail__body">
          <section class="job-detail__block" aria-labelledby="about-title">
            <h2 class="t-h3" id="about-title">¿Quiénes somos?</h2>
            <p class="t-body-l" data-job-field="about"></p>
          </section>
          <section class="job-detail__block" aria-labelledby="challenge-title">
            <h2 class="t-h3" id="challenge-title">Tu principal desafío</h2>
            <p class="t-body-l" data-job-field="challenge"></p>
          </section>
          <section class="job-detail__block" aria-labelledby="req-title">
            <h2 class="t-h3" id="req-title">¿Qué buscamos en ti?</h2>
            <ul class="job-detail__list t-body" data-job-field="requirements"></ul>
          </section>
        </div>
        <aside class="job-detail__aside" aria-label="Postulación">
          <a class="btn btn--primary" href="postulacion.html" data-job-apply-link>Postular a esta oferta</a>
          <a class="btn btn--tertiary hit" href="oportunidades-laborales.html">Ver todas las ofertas<svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg></a>
        </aside>
      </div>
    </div>

  </main>

  <site-footer></site-footer>
</body>
</html>
